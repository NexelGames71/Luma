# Luma Engine - default engine configuration.
# Values here seed the application at startup; a project's own config overrides.

[Application]
name = Luma Engine

[Window]
title = Luma Engine
width = 1280
height = 720
fullscreen = false
vsync = on

[Renderer]
# Selected in Milestone 2 when the Vulkan backend comes online.
gpu_index = 0
render_scale = 1.0

[Log]
# One of: trace, debug, info, warning, error, fatal, off
level = trace
file = Saved/Logs/Luma.log
